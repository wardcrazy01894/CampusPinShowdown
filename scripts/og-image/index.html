<!doctype html>
<!--
  Source for public/og-image.png (1200×630 social share card).
  Regenerate with:  npm run og-image   (headless Chrome screenshot; see
  docs/OPERATIONS.md §Share image). Fonts are the system stack so the render is
  reproducible on any Mac without a webfont download.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica,
          Arial, sans-serif;
        color: #eef2f7;
      }
      body {
        background:
          radial-gradient(
            ellipse at 80% 20%,
            rgba(244, 180, 0, 0.12),
            transparent 55%
          ),
          linear-gradient(135deg, #0b1118 0%, #0f1720 60%, #141f2b 100%);
        display: flex;
        align-items: center;
        gap: 64px;
        padding: 0 80px;
        box-sizing: border-box;
      }
      .mark {
        width: 280px;
        height: 280px;
        border-radius: 56px;
        background: #1b2633;
        display: flex;
        align-items: center;
        justify-content: center;
        flex: none;
      }
      .mark svg {
        width: 200px;
        height: 200px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 84px;
        line-height: 1;
        font-weight: 800;
        letter-spacing: -2px;
      }
      h1 .pin {
        color: #f4b400;
      }
      .sub {
        font-size: 32px;
        line-height: 1.3;
        margin: 0 0 28px;
        opacity: 0.9;
        max-width: 700px;
      }
      .tag {
        font-size: 24px;
        font-weight: 700;
        color: #f4b400;
        margin: 0 0 6px;
      }
      .tiers {
        font-size: 22px;
        opacity: 0.8;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="mark">
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M32 9c-9.7 0-17.5 7.7-17.5 17.2C14.5 39.4 32 55 32 55s17.5-15.6 17.5-28.8C49.5 16.7 41.7 9 32 9z"
          fill="#f4b400"
        />
        <circle cx="32" cy="26" r="6.8" fill="#1b2633" />
      </svg>
    </div>
    <div>
      <h1>Campus<span class="pin">Pin</span> Showdown</h1>
      <p class="sub">
        Where is Texas Tech? Pin America's college towns on a night-lights map.
      </p>
      <p class="tag">5 schools a day · same puzzle for everyone</p>
      <p class="tiers">🟢 2 easy · 🟡 2 medium · 🔴 1 hard</p>
    </div>
  </body>
</html>
